<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaga for the NES</title>
<style>
  body { margin: 0; background: #111; color: #ccc; font: 14px/1.4 system-ui, sans-serif; text-align: center; }
  #box { width: min(100vw, 512px); height: min(93.75vw, 480px); margin: 16px auto; }
  a { color: #8cf; }
</style>
</head>
<body>
<div id="box"><div id="game"></div></div>
<p>Galaga for the NES, in the browser with <a href="https://emulatorjs.org/">EmulatorJS</a>.<br>
Click Start Game (the browser needs a click before it plays sound). Arrow keys move, Z or X fires, Enter is Start (start, pause); the gear menu shows all keys.<br>
<a href="https://github.com/Shadester/galagas/tree/master/nes">Source</a> · <a href="../">All versions</a></p>
<script>
  EJS_player = '#game';
  EJS_core = 'nes';
  EJS_gameUrl = 'galaga.nes';
  EJS_gameName = 'Galaga';
  EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
