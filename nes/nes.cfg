# NES Galaga: MMC1 (SNROM): 64 KB PRG in four 16 KB banks, 8 KB CHR RAM, 8 KB battery RAM at $6000.
# Bank 3 is fixed at $C000; bank 0 is at $8000 while the game runs (bank 1, the graphics, only while they are copied to CHR RAM).
# Every bank ends with the same start stub and vectors: at power-on the MMC1 may map any bank pair in 32 KB mode.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    OAM:    start = $0200, size = $0100, type = rw, file = "";
    RAM:    start = $0300, size = $0500, type = rw, file = "";
    WRAM:   start = $6000, size = $1F00, type = rw, file = "";
    SAVE:   start = $7F00, size = $0100, type = rw, file = "";
    HEADER: start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG0:   start = $8000, size = $3FE0, type = ro, file = %O, fill = yes, fillval = $FF;
    STUB0:  start = $BFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG1:   start = $8000, size = $3FE0, type = ro, file = %O, fill = yes, fillval = $FF;
    STUB1:  start = $BFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG2:   start = $8000, size = $3FE0, type = ro, file = %O, fill = yes, fillval = $FF;
    STUB2:  start = $BFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG3:   start = $C000, size = $3FE0, type = ro, file = %O, fill = yes, fillval = $FF;
    STUB3:  start = $FFE0, size = $0020, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    OAM:      load = OAM,    type = bss, align = $100;
    BSS:      load = RAM,    type = bss;
    WBSS:     load = WRAM,   type = bss, define = yes;
    DATA:     load = PRG3,   run = WRAM, type = rw, define = yes;
    SAVE:     load = SAVE,   type = bss;
    HEADER:   load = HEADER, type = ro;
    CODE0:    load = PRG0,   type = ro;
    GFX:      load = PRG1,   type = ro;
    CODE2:    load = PRG2,   type = ro, optional = yes;
    CODE:     load = PRG3,   type = ro;
    RODATA:   load = PRG3,   type = ro;
    STUB0:    load = STUB0,  type = ro;
    STUB1:    load = STUB1,  type = ro;
    STUB2:    load = STUB2,  type = ro;
    STUB3:    load = STUB3,  type = ro;
}
